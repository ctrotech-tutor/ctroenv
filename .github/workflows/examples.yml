name: Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Consumer-tests the published libraries: each example installs its
# dependencies lockless from the registry (example lockfiles are not
# committed by design) and runs its documented happy path via `smoke`.
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - basic-node
          - with-cli
          - with-express
          - with-nextjs
          - with-vite
          - monorepo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: examples/${{ matrix.example }}
      - run: npm run smoke
        working-directory: examples/${{ matrix.example }}
