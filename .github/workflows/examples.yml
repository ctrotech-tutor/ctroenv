name: Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Consumer-tests the published libraries: each example installs its
# dependencies lockless from the registry (example lockfiles are not
# committed by design) and runs its documented happy path via `smoke`.
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - basic-node
          - with-cli
          - with-express
          - with-nextjs
          - monorepo
          # TODO: add with-vite once @ctroenv/vite >= 1.0.6 is published.
          # 1.0.5 ships a single Node entry that breaks `vite build`
          # (see packages/vite/src/browser.ts); the example's `smoke`
          # script is ready and verified against the fixed build.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: examples/${{ matrix.example }}
      - run: npm run smoke
        working-directory: examples/${{ matrix.example }}
