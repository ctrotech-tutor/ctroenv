name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Build
        run: npm run build

      # semantic-release-monorepo must run once per package, from inside the
      # package dir: from the repo root its commit filter matches nothing and
      # the run green-no-ops. Sequential, in dependency order (one working
      # copy, so each run's push stays fast-forward). Release commits carry
      # [skip ci] so they don't retrigger this workflow.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          for pkg in shared core cli node vite nextjs; do
            (cd packages/$pkg && npx --no-install semantic-release)
          done
